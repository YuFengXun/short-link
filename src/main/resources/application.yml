server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/short_link?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update      # 启动时自动建表，开发阶段很方便
    show-sql: true           # 打印 SQL，方便调试
    properties:
      hibernate:
        format_sql: true     # SQL 格式化
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: localhost
      port: 6379
